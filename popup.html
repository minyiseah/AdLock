<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 300px;
      font-family: "Comic Sans MS", cursive, sans-serif;
      background-color: #c0c0c0;
      padding: 10px;
    }

    h3 {
      margin-top: 0;
      text-align: center;
      color: #000080;
    }

    .input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    input {
      flex: 1;
      padding: 5px;
      border: 2px inset white;
    }

    button {
      background-color: #c0c0c0;
      border: 2px outset white;
      cursor: pointer;
      font-weight: bold;
    }

    button:active {
      border: 2px inset white;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      background: white;
      border: 2px inset white;
      max-height: 200px;
      overflow-y: auto;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px;
      border-bottom: 1px dotted #ccc;
    }

    li:last-child {
      border-bottom: none;
    }

    .remove-btn {
      color: red;
      border: 1px solid red;
      font-size: 10px;
      margin-left: 5px;
    }

    input[type=range] {
      width: 100%;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="mainMenu">
    <h3>Productivity Enforcer</h3>
    <div style="text-align: center; margin-bottom: 10px;">
      Today's Focus: <span id="totalTime">0</span> mins
    </div>

    <div class="input-group" style="flex-direction: column;">
      <label>Focus Duration (min): <input type="number" id="duration" value="30" min="1"></label>
      <label>Intensity (1-5): <input type="range" id="intensity" min="1" max="5" value="3"></label>
    </div>

    <div id="timerDisplay"
      style="text-align: center; font-size: 24px; font-weight: bold; margin: 10px 0; display: none;"></div>

    <button id="startBtn" style="width: 100%; margin-bottom: 5px;">Start Focus</button>
    <button id="stopBtn" style="width: 100%; margin-bottom: 5px; display: none;">Stop</button>
    <button id="blacklistBtn" style="width: 100%;">Edit Blacklist</button>
    <button id="historyBtn" style="width: 100%; margin-top: 5px;">View History</button>
  </div>

  <div id="blacklistMenu" style="display: none;">
    <h3>Distraction List</h3>
    <button id="backBtn" style="margin-bottom: 10px;">&lt; Back</button>

    <div class="input-group">
      <input type="text" id="newSite" placeholder="example.com">
      <button id="addBtn">Add</button>
    </div>

    <ul id="siteList"></ul>
  </div>

  <div id="historyMenu" style="display: none;">
    <h3>Focus History</h3>
    <button id="historyBackBtn" style="margin-bottom: 10px;">&lt; Back</button>
    <ul id="historyList"></ul>
  </div>
  <script src="popup.js"></script>
</body>

</html>
